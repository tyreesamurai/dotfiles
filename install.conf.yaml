- defaults:
    link:
      create: true
      relink: true

- clean: ["~", "~/.config", "~/.local/bin"]

- link:
    ~/.config/tmux/tmux.conf: tmux/tmux.conf
    ~/.config/nvim: nvim
    ~/.config/starship: starship
    ~/.config/ghostty: ghostty
    ~/.config/git: git
    ~/.local/bin:
      glob: true
      path: bin/*
    ~/.zshenv: zsh/zshenv
    ~/.config/zsh/.zshrc: zsh/zshrc
    ~/.config/zsh/.zprofile: zsh/zprofile
    ~/.config/zsh/:
      glob: true
      path: zsh/*.zsh
