# ~/.config/tmux/tmux.conf
# Every line is here on purpose. If you can't say why a line exists, delete it.

# ---------------------------------------------------------------- terminal
# tmux-256color is the correct TERM inside tmux (screen-256color lacks italics
# and some keys). RGB gives Neovim true color through tmux.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB,xterm*:RGB"

# Pass Shift+Enter and other modified keys through (Claude Code, Neovim).
set -s extended-keys on
set -as terminal-features ",xterm*:extkeys"

# Images and other escape sequences from Neovim plugins reach the terminal.
set -g allow-passthrough on

# Neovim's autoread and FocusGained need this.
set -g focus-events on

# Fast Esc in Neovim without breaking escape sequences over ssh.
set -sg escape-time 10

set -g history-limit 50000
set -g display-time 3000
set -g mouse on

# ---------------------------------------------------------------- windows
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ---------------------------------------------------------------- keys
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# Splits and new windows open in the current pane's directory.
unbind %
unbind '"'
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Resize with prefix + hjkl (repeatable). Zoom stays on the default prefix + z.
bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5

# ---------------------------------------------------------------- copy mode
# Vi keys. With set-clipboard on, yanks go to the system clipboard through the
# terminal (OSC 52), so the tmux-yank plugin isn't needed.
setw -g mode-keys vi
set -g set-clipboard on
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send -X rectangle-toggle
# Keep the selection after a mouse drag instead of copying and exiting.
unbind -T copy-mode-vi MouseDragEnd1Pane

# ---------------------------------------------------------------- plugins
# Ctrl+h/j/k/l moves between tmux panes and Neovim splits.
# Needs the matching Neovim plugin too (see the notes).
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
# Theme, pinned to a release tag (installs to plugins/tmux).
set -g @plugin 'catppuccin/tmux#v2.3.2'
set -g @plugin 'tony-sol/tmux-kubectx'

# Keep only the ones you actually use:
# Sessions survive reboots: restore windows, panes, and Neovim sessions.
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'
# prefix + u: pick a URL on screen with fzf and open it. Needs fzf.
# set -g @plugin 'wfxr/tmux-fzf-url'
# prefix + space: hint-copy text on screen. Compiles with cargo on install.
# set -g @plugin 'fcsonline/tmux-thumbs'
# prefix + F: fzf menu for sessions, windows, and commands. Needs fzf.
# set -g @plugin 'sainnhe/tmux-fzf'

# Install TPM and the plugins automatically on a fresh machine.
if "test ! -d ~/.config/tmux/plugins/tpm" \
  "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"

# ---------------------------------------------------------------- theme
# Catppuccin must load before status-left/right are set, so it runs here
# directly instead of waiting for TPM at the end. Bump the tag above to upgrade.
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W#{?window_zoomed_flag, 󰁌,}"
set -g @catppuccin_date_time_text " %H:%M"
if "test -f ~/.config/tmux/plugins/tmux/catppuccin.tmux" \
  "run ~/.config/tmux/plugins/tmux/catppuccin.tmux"

# ---------------------------------------------------------------- status line
set -g status-position top
set -g status-interval 5
set -g status-left-length 40
set -g status-right-length 120
set -g status-left "#{E:@catppuccin_status_session} "
set -g status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_date_time}"
# Kubernetes context. Uncomment along with the tmux-kubectx plugin above.
set -agF status-right "#{E:@catppuccin_status_kube}"

run -b "~/.config/tmux/plugins/tpm/tpm"
